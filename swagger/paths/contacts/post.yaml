tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a new contact with optional photo upload'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            type: string
            description: 'Contact name'
            example: 'John Doe'
          phoneNumber:
            type: string
            description: 'Contact phone'
            example: '12123142411'
          email:
            type: string
            description: 'Contact email'
            example: 'john@example.com'
          isFavourite:
            type: boolean
            description: 'Whether contact is favourite'
            example: true
          contactType:
            type: string
            description: 'Type of contact'
            enum: [work, home, other]
            example: home
          userId:
            type: string
            description: 'User ID'
            example: '65e4decdd286b30065d54af9'
          photo:
            type: string
            format: binary
            description: 'Contact photo file upload'
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
